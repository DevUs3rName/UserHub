<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UserHub</title>
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon.png">
  <link rel="shortcut icon" type="image/png" href="img/favicon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    .image-wrapper {
      width: 100%;
      max-width: 90px;
      margin: 0 auto 1.2rem auto;
    }

    .image-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 0;
    }

    .btn-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }

    .btn-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: #1a1a1a;
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 1.2rem;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
      font-family: inherit;
      text-decoration: none;
    }

    .btn-key:hover {
      background: #333333;
    }

    .btn-key svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .btn-discord {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      color: #ffffff;
      width: 34px;
      height: 34px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
      text-decoration: none;
      padding: 0;
    }

    .btn-discord:hover {
      background: #3d3d42;
    }

    .btn-discord svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      display: block;
    }

    .sub {
      font-size: 0.75rem;
      color: #aaaaaa;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="image-wrapper">
      <img src="img/userhub.png" alt="UserHub">
    </div>

    <div class="btn-group">
      <a href="https://linkvertise.com/7850825/o61iTt0WYFWV?o=sharing" class="btn-key" target="_blank">
        <svg viewBox="0 0 24 24">
          <path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
        </svg>
        Get Key
      </a>

      <a href="https://discord.gg/" class="btn-discord" target="_blank">
        <svg viewBox="0 0 127.14 96.36">
          <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2.05a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2.05a68.42,68.42,0,0,1-10.85,5.18,77.7,77.7,0,0,0,6.89,11.11A105.73,105.73,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.68,11.43-12.68S53.86,46,53.86,53,48.76,65.69,42.45,65.69Zm42.24,0C78.42,65.69,73.24,60,73.24,53s5-12.68,11.43-12.68S96.1,46,96.1,53,91,65.69,84.69,65.69Z"/>
        </svg>
      </a>
    </div>

    <p class="sub">UserHub is the best.</p>
  </div>
</body>
</html>
